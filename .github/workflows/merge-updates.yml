# Merges Dependabot's grouped pull request (minor and patch updates, dependabot.yml) once Checks passed on it; a major
# update's pull request of its own waits for a person. It runs after Checks in the repository's own context and checks
# out nothing: it only merges the pull request Checks ran on.
name: Merge dependency updates

on:
  workflow_run:
    workflows: [Checks]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.actor.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          case "$BRANCH" in
            dependabot/*/python-* | dependabot/*/actions-* | dependabot/*/docker-*)
              gh pr merge "$BRANCH" --squash --delete-branch --repo "$REPO" ;;
            *) echo "not a grouped minor or patch update: left for review" ;;
          esac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPO: ${{ github.repository }}
