time:72;ph:1;tag:Enfo;spellid:98008;
time:75;ph:1;tag:Pomaa;spellid:97462;
time:75;ph:1;tag:everyone;text:Big Personals;"""
expect = """Says the Sszorak note (Mythic) is saved for the guild, with 17 timed cooldowns and 1 callout, and that pulls
are checked against it from now on without a paste."""
wrong = ["says it can't save a note here, or that only the Discord bot saves one",
         "checks a pull against the note without saving it",
         "asks the user to paste the note again or in another form"]

[[case]]
id = "plan-spots-at-virulence"  # a pasted raidstrats.gg plan (tests/fixtures/real/plans) against a pull: who was off
tools = ["raid_plan"]
asker = "Enfo"
question = """our sszorak spread plan, were people on their spots for virulence on pull 42?

raidstrats-addon-"""
expect = """Checks pull 42 against the plan at each Virulence: Algmor was off their spot at all four, Scopidruid at the
first three, Agonco from 1:20; most of the raid was on theirs."""
facts = ["four Virulences checked, at 0:31, 1:20, 2:37 and 3:28",
         "Algmor 22-32 yd off, mostly at Agonco's spot",
         "Scopidruid furthest off, 58 yd at 2:37",
         "at 1:20 Draiman and Sonyosh were hit by Agonco's Virulence"]
derived = ["22-32"]
wrong = ["says the plan can't be read or checked, or asks for it again",
         "says a player was off their spot whom the check found on it (Sonyosh, Wutroll, Deathadim)"]

[[case]]
id = "plan-where-do-i-stand"  # a pasted plan read with no pull: the asker's spot, as the plan draws it
tools = ["raid_plan"]
asker = "Krøpling"
question = """where do i stand on sszorak? this is our spread plan

raidstrats-addon-"""
expect = """Says Krøpling's spot on the plan (#13) is to the boss's left, out with the ranged rather than in the
melee next to the boss, and that the plan stacks everyone around the boss for Virulence."""
facts = ["the tanks and melee are just beside the boss, the ranged a little further out",
         "up to 4 can stay out of the stack: the healers in the side panel (Enfo, Namsus, Miralupa, Lïzårðmâñ)",
         "Martin runs far to bait Serpent's Fury"]
wrong = ["says it needs a pull, a log or a report to answer, or checks a pull instead",
         "says Krøpling isn't on the plan, or puts them in the side panel",
         "gives a distance in yards: the plan has no room coordinates"]

[[case]]
id = "plan-who-stays-out"  # the plan's side panel and its notes, with no pull
tools = ["raid_plan"]
asker = "Enfo"
question = """who's allowed to stay out of the stack in this sszorak plan?

raidstrats-addon-"""
expect = """Says up to 4 can stay out of the stack, the players in the plan's side panel: Enfo, Namsus, Miralupa and
Lïzårðmâñ (healers, to plant their feet and heal), who must stack with the group if anyone dies; and that Martin
runs far to bait Serpent's Fury."""
wrong = ["says it needs a pull, a log or a report to answer",
         "names someone with a spot in the stack as allowed to stay out"]

