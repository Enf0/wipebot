[[case]]
id = "plan-spots-at-virulence"  # a pasted raidstrats.gg plan (tests/fixtures/real/plans) against a pull: who was off
tools = ["raid_plan"]
asker = "Enfo"
question = """our sszorak spread plan, were people on their spots for virulence on pull 42?

raidstrats-addon-"""
expect = """Checks pull 42 against the plan at each Virulence: Algmor was off their spot at all four, Scopidruid at the
first three, Agonco from 1:20; most of the raid was on theirs."""
facts = ["four Virulences checked, at 0:31, 1:20, 2:37 and 3:28",
         "Algmor 22-32 yd off, mostly at Agonco's spot",
         "Scopidruid furthest off, 58 yd at 2:37",
         "at 1:20 Draiman and Sonyosh were hit by Agonco's Virulence"]
derived = ["22-32"]
wrong = ["says the plan can't be read or checked, or asks for it again",
         "says a player was off their spot whom the check found on it (Sonyosh, Wutroll, Deathadim)"]
