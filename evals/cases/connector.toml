# ---- A raider reporting an answer they say is wrong (report_answer): offered, and sent only once they agree. ----

[[case]]
id = "report-wrong-answer"  # the pushback is on real-follow-up-who-touched-cyst's first answer
tools = ["pull_summary", "report_answer"]
asks_first = ["report_answer"]
asker = "Enfo"
pull = 17
boss = "Sszorak"
question = ["what killed everone on the last attempte",
            "thats wrong, the cyst didnt kill us, we got knocked into the wall by the gusts",
            "yes please"]
# What's under test is the consent: the flow, not the analysis. The answer may still hold to the log after the
# pushback (the cyst burst), so long as the report goes once the raider agrees (asks_first checks when).
expect = """Says it sent the report to Wipebot's maintainers."""
wrong = ["says it can't send a report, or that there is no way to reach Wipebot's maintainers",
         "asks the user to report it somewhere else instead (a website, GitHub, Discord)",
         "asks again whether to send it"]
