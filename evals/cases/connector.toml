[defaults]
report = "vjt3KLbN8g62J1H9"  # Mon 12 Oct, the night of the raid note pasted below

# ---- What only the connector does: an officer saving a pasted raid note or plan (save_note_or_plan), and a pasted
#      plan checked against a pull. Run only without --bot: the bot saves a paste itself, before the model sees it. Every asker here is an officer, of a
#      guild no case's report is from (run.py's as_officer), so what one case saves no other reads. ----

[[case]]
id = "officer-saves-note"  # the start of the raid's Sszorak note (tests/fixtures/real/notes), to keep for the guild
tools = ["save_note_or_plan"]
asker = "Enfo"
question = """save this for the guild so you check our pulls against it

EncounterID:3420;Difficulty:Mythic;Name:Sszorak

time:11;ph:1;tag:Dragepie;spellid:374227;
time:16;ph:1;tag:Lïzårðmâñ;spellid:370537;
time:16;ph:1;tag:Miralupa;spellid:64843;
time:16;ph:1;tag:Namsus;spellid:200183;
time:20;ph:1;tag:Nexsozz;spellid:51052;
time:21;ph:1;tag:Sonyosh;spellid:383013;
time:27;ph:1;bossSpell:1297707;tag:Scopidruid;spellid:106898;
time:58;ph:1;tag:Lïzårðmâñ;spellid:374227;
time:63;ph:1;tag:Namsus;spellid:64843;
time:63;ph:1;tag:Miralupa;spellid:200183;
time:68;ph:1;tag:Sonyosh;spellid:192077;
time:68;ph:1;tag:Enfo;spellid:114052;
