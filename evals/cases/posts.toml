[defaults]
report = "KBYT4xXn7VNjDgh8"

# ---- The bot's posts after each wipe (follow_pulls): asked as the bot asks itself when a pull ends, from what the
#      raider asked for (`request`) or, without one, for the asker's own feedback. Run only with --bot. Each is a
#      wipe case of wipes.toml kept to what a post has room for: how the pull ended, what to do on the next. Its
#      length is held by code (`form`: the four lines and about 500 characters the post is asked for), not by the
#      judge. Three stand for the form: a post to the raid on two bosses, and a raider's own feedback. ----

[[case]]
id = "post-unkicked-add"  # wipe-unkicked-add as a post
tools = ["pull_summary"]
report = "ZRNhqaprvfmBgMkH"
boss = "Nek'zali the Soulcoiler"
pull = 1
discord_name = "enfo"
request = "why we wiped and what to fix"
expect = """Says the intermission's Drowned Echo wasn't handled: its Soulcoiler's Curse casts went through unkicked
(two), and the deaths that followed lost the pull; the fix is kicking every Curse and killing the Echo."""
form = {lines = 4, chars = 500}  # by code: the lines and about the characters a post is asked for
wrong = ["her energy bar filling (Uncoiled Rage) ended the pull",
         "says a named player should have kicked or missed their kick"]

[[case]]
id = "post-tank-death"  # wipe-tank-death as a post
tools = ["pull_summary"]
report = "dTQMvNbBcPh6mDrA"
boss = "The Twin Fangs"
pull = 5
discord_name = "enfo"
request = "why we wiped and what to fix"
expect = """Says a tank death at 7:00 (Caustic Deluge) started it: with one tank left, the next Stone Breaker set
(7:13-7:19), which a tank soaks, went off on the raid and killed half of it."""
form = {lines = 4, chars = 500}  # by code: the lines and about the characters a post is asked for
numbers = ["7:00", "7:13"]  # by code: the tank's death and the Stone Breaker set
wrong = ["says the tank's first death at 2:51 lost the pull",
         "says the players who died to Stone Breaker stood in it, or blames the DPS for those deaths",
         """says the unsoaked Stone Breaker set or the swap was a named player's mistake, or their job that they failed,
as if the log showed whose it was (naming the tank whose death at 7:00 started it is the answer, not blame; that
Karadim, the one tank left and holding both serpents from 7:03, got no Stone Breaker debuff from the 7:13 set, had
no stacks left and could have taken it is what the log shows; a tank soaking each set is the guides' fix)"""]

[[case]]
id = "post-own-ravage"  # wipe-dps-in-ravage as their own feedback
tools = ["player_pull", "death_recap"]
where = "in a DM"
boss = "Sszorak"
pull = 29
asker = "Martin"
expect = """Says Ravage, the tank frontal, killed them, so they stood in the cone, and that the one thing for the next
pull is staying out of the frontal."""
form = {lines = 4, chars = 500}  # by code: the lines and about the characters a post is asked for
wrong = ["a healing gap or a missing defensive is what killed them",
         "says this death lost the pull"]
