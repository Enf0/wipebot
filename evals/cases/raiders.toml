[[case]]
id = "real-healer-overheal-pushback"  # a Holy Priest pushes back: overheal alone says nothing (#1039)
tools = ["healing", "spec_guide"]
# The method under test: check each point against the tools; agree where the log agrees, correct or mark as
# unchecked what it doesn't, rather than taking all of it on faith.
report = "64hVgfmydQGNxC7A"
question = """Her vil jeg gjerne dele noen tanker, som jeg synes wipeboy overser eller svarer litt feil på.

Vi har ikke et overhealing probelm. og overhealing helt sånn isolert sett er en verdiløs stat og se på og \
sammenligne healere på. Ta for.eks at jeg skal poppe hymn for at du skal få mest mulig ut av apoen din. Da vil jeg \
gjerne ha 1-2 ticks oppe (Som gir deg mer healing) fordi det øker healinga de med 10% (Dette kan være tall som ikke \
stemmer helt) Da vil jeg få overhealing men generelt sett vil vi heale mer. Du vil også som priest kontinuerlig \
caste POM, Serenity og flash heals for å holde oppe echos renew og jakte benediction procs. Overhealing er i min bok \
KUN  et probelm om vi sliter med mana, eller vi ser at det er steder der vi mangler healing, å da må vi flytte på \
cds da brorparten av overhealing er fordi vi topper raids.

Personlig når det kommer til priest mener jeg også at Mastery/Crit er like viktig i Raids så bør du ha haste til du \
er komfortabel (Jeg liker å ha 14% nå med den daggern som gir deg hasteprocc) versa er 💩"""
asker = "Namsus"
expect = """Agrees that overheal alone doesn't measure a healer and that the log shows no overheal problem on Coiled
Altar, since no healer went under 30% mana; and checks their stat order against the guide (Crit > Mastery >
Versatility > Haste in raid) rather than agreeing to all of it."""
facts = ["the lowest mana was 39% (Enfo, pull 15)",
         "the priests overhealed 28-30% in the damage spikes and 45-46% the rest of the time",
         "healing cooldowns ready and unused in the spikes: Spirit Link Totem and Rewind 14 times each",
         "Divine Hymn adds 4% healing taken a tick, stacking",
         "Method's guide ranks Versatility above Haste in raid"]
wrong = ["says the priests have an overhealing problem",
         "states that each Divine Hymn tick adds about 10% healing",
         "agrees that Versatility is a weak stat for Holy Priests in raid"]

[[case]]
id = "real-holy-paladin-tasks-pushback"  # a Holy Paladin pushes back: tasks and two holy priests (#1129-#1130)
tools = ["compare_with_top", "player_pull"]
# The method under test: recheck the pushback, lead with the verdict, and grant only what a tool shows; #1130 opened
# with "you're right that the healer comp pushes your numbers" against compare_with_top's own healer shares.
report = "4N9JMwBFPAjXyV3Z"
where = "in a DM"
question = ["how did I do on pull 12?",
            """you forget the human factor. if I could stand still and just click raid frames I'd be close too, but \
when you have to move, turn the camera, move the orb right and click the right frames a lot can go wrong. with 0 \
assignments and the same healers it would look completely different, we have 2 holy priests for example"""]
asker = "Cptola"
pull = 12
boss = "The Coiled Altar"
expect = """Holds what the first answer found after rechecking against top Holy Paladins on kills with 5 healers,
who meet the same fight and move and carry orbs too: the healer comp doesn't explain the gap (the top paladins'
raids also had 5 healers and they took 20-24% of the healing to Cptola's 10%), and most of the time with no cast
(13% against 1%) isn't the fight's. It concedes only what a tool shows was wrong, and doesn't open by agreeing with
the raider."""
drifts = ["3.2", "3.5", "1.6", "1.8", "24%"]
facts = ["Beacon of Virtue 1.4 a minute against 3.4 (3.2-3.5)",
         "Divine Toll 0.9 a minute against 1.7 (1.6-1.8)",
         "10% of the healers' healing, the top paladins 20-24%, all in raids of 5 healers",
         "casting gaps of 3 s or more 13% of the time against 1% (0-2%)",
         "Holy Power at its cap 11% of the time, top parses 9% (7-16%): the fight's"]
wrong = ["says the two holy priests or the healer comp explain much of the gap",
         "opens by agreeing with the raider (\"you're right that ...\") before the verdict",
         "drops a point the first answer made because of movement, the orb or assignments the log doesn't show"]

