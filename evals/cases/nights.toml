[defaults]
report = "KBYT4xXn7VNjDgh8"

# ---- The raid leader, over a night ----

[[case]]
id = "night-bottleneck"
tools = ["boss_guide", "mechanic_hits", "progress", "pull_summary", "pull_timeline"]
question = "What keeps wiping us on Sszorak?"
expect = """The boss enraging (Unbound Ferocity) because a Serpent's Fury isn't popped by 14 players, more than
anything else. Why the stack fell short may be either: on most pulls the enrage ended enough were alive and it still
didn't form, and on others early deaths left too few."""
facts = ["the boss enraged on 20 of 33 pulls, and the enrage is what ended 10",
         "11 of them at 1:17-1:25, the stack before the intermission; 6 at 2:32-2:33, 3 at 0:39-0:40",
         "on pulls 13, 23, 24 and 31 it came with 15 to 18 alive, enough for the 14-player stack",
         "the early deaths are Virulence and Tempest (24 each among the first three deaths per pull)"]
wrong = ["names the Mutilate soak, rather than the missed Serpent's Fury stacks, as what ends most pulls",
         "the second Serpent's Fury pop is too early, stated as fact rather than a possibility"]

[[case]]
id = "night-healing-cooldowns"  # from the raiders' own question (answer #265)
tools = ["boss_guide", "healing"]
question = "When do we take the most damage on Sszorak, and are our healing cooldowns in the right place?"
expect = """The damage comes in waves at the same moments every pull. The healing cooldowns go on the second wave,
at 1:04-1:17 (2.7 and 2.2 per spike), and almost none on the first, at 0:20-0:27 (Virulence and Mutilated Gash, 0.1
per spike), which came in 21 pulls."""
facts = ["in the first wave healing kept pace without cooldowns: 3.07M/s against 3.14M/s taken",
         "Venomous Surge at 0:31-0:40 got no healing cooldown in any of its 6 spikes, healing 2.25M/s against 3.40M/s",
         "a healing cooldown was ready and unused in all 21 first-wave spikes"]
wrong = ["the healing cooldowns are well spread over every spike",
         "the first wave's deaths came from too little healing, though healing matched the damage taken"]

[[case]]
id = "night-not-a-dps-problem"
tools = ["boss_guide", "compare_pulls", "progress"]
report = "kTMfFRQ324Hvx6G7"
question = "Do we need more DPS for Vashnik?"
expect = """No: Vashnik has no damage enrage and no wipe ended on one; the wipes were mechanics (early Plague Wave
deaths, then Catalytic Bile as pulls fell apart), not a damage check; the raid killed it on pull 19. Saying more
damage would mean fewer Imbibes, so fewer totem rounds, is fair."""
facts = ["Plague Wave was the most common of each pull's first three deaths (29), many around 1:00",
         "Malignance (totems not cleared) next with 12",
         "Catalytic Bile killed the most until each wipe was decided: 63 deaths over 19 pulls, never the first",
         "the best wipe, pull 16, reached 9.4% at 6:41, deaths spread out from 3:48",
         "the kill on pull 19 took 7:00",
         "the guide says there's no DPS enrage (a 5th healer is worth it)"]
# compare_pulls puts pull 16 behind the closest-item-level fast kill (4:45) from 0:30 on, which is why the expect
# allows the fewer Imbibes. The Malignant Burst deaths on pulls 10 and 16 came as or after half the raid was dead
# (5:09, 6:40).
wrong = ["the raid needs more damage to beat an enrage or damage check on Vashnik",
         "calls Flame Infusion or Shadow Infusion an enrage (the boss gains them at its first Imbibe)",
         "says the Malignant Burst deaths on pulls 10 and 16 were a damage check failed"]
[[case]]
id = "night-improving"  # what went right over a night
tools = ["progress"]
report = "dTQMvNbBcPh6mDrA"
question = "Did we actually get better on the Twin Fangs tonight?"
asker = "Enfo"
expect = """Yes, with the night's numbers: the wipes went from 27.6% on pull 1 to 2.3% on pull 6 (or, as the average
wipe, from 52.8% in the first third of the night to 8.9% in the last), and the boss died on pull 7."""
facts = ["the average wipe went from 52.8% in the first third to 17.3% in the middle and 8.9% in the last",
         "each pull from 3 to 6 was the best of the night so far: 18.3%, 16.4%, 15.5%, 2.3%",
         "the first death came later: at 5:55 on pull 6 and at 6:46 on the kill"]
wrong = ["the night was flat or got worse"]
numbers = ["2.3% or 8.9%"]
[[case]]
id = "night-who-dies-first"  # accountability, fairly
tools = ["progress"]
where = "in a DM"  # a DM, as the asker had it
report = "PjKR7hQwtYpd8WDz"
question = "Who keeps dying first on Sentinels?"
asker = "Karadim"
expect = """Scopidruid died first most often, on 3 of the 7 pulls (2, 3 and 4), each time to something different;
Grusarn was first twice and nobody else more than once. Only one of the three was a death that mattered alone: on
pull 3 Scopidruid was one of five killed by Noxious Blast within a second, and on pull 4 the pull went on two
minutes after their death to the night's best wipe."""
facts = ["Grusarn first on pulls 5 and 6; Providence on 1 and Wutroll on 7",
         "pull 3: Noxious Blast killed 5 at once at 2:35, Scopidruid first only by the order",
         "pull 4: Scopidruid died at 2:17, the next death came at 4:13, and the pull reached 36.3%, the night's best",
         "on pulls 2 and 4 they died in the Blood side's damage after an Unstable Miasma hit, with 15 Mark of Blood stacks",
         "no healthstone used before any of the three deaths; on pull 4 Barkskin was not used"]
wrong = ["names someone other than Scopidruid as dying first most often",
         "says Scopidruid's deaths lost those pulls",
         "says Scopidruid stood in the wrong place or broke an assignment, as if the log showed it",
         "claims what a class can or can't do (\"druids can't...\")"]
[[case]]
id = "night-kill-what-went-right"
tools = ["boss_guide", "compare_pulls", "mechanic_hits", "progress", "pull_map", "pull_summary", "pull_timeline"]
report = "ZRNhqaprvfmBgMkH"
question = "We finally killed Ula'tek! What did we do better than on the 9.3% pull?"
asker = "Enfo"
expect = """Stayed alive through the Caustic Waves, Volatile Purge and second platform break around 8:00: the boss's
health was level on both pulls until then, but pull 9 fell to 11 players alive by 8:02, while the kill had 23 alive at
8:01. The kill wasn't clean either: a Calcified Corpse from the last Serpent's Bite killed most of the raid at
9:36-9:37, and the boss died at 9:38 in the last Venomous Heart window."""
facts = ["boss health level with the kill until the wipe: 15% on pull 9 and 16% on the kill at 8:02",
         "pull 9: Caustic Waves hit 3, then 3, then 8 players at 7:52, and Volatile Purge killed 6 within 1 s at 7:58, stacking up to 3 on one player",
         "the kill lost one player at the platform break (Circling Prey at 8:01) and three in all before 8:49",
         "on the kill the last Serpent's Bite (9:20) was kept the full 15 s; its Calcified Corpse at 9:35 killed 16, and the boss died at 9:38, after the Venomous Heart opened at 9:33"]
wrong = ["says the kill won mainly by doing more damage, or that pull 9 was behind on damage",
         "says the kill was clean or had far fewer deaths than pull 9 (it had 24, pull 9 had 26)",
         "says every Serpent's Bite was soaked on the kill"]
[[case]]
id = "night-raid-prep"
tools = ["raid_prep"]
question = "Is everyone prepared for Sszorak: flasks, food, runes and oils?"
expect = """Flasks, food and weapon oils are complete, but most of the raid had no augment rune."""
facts = ["16 of 20 had no augment rune",
         "one player had no vantus rune",
         "one player's main-hand weapon had no enchant"]
wrong = ["says everyone had an augment rune"]

[[case]]
id = "night-add-control"  # what the log shows about the adds, and what it can't (kill order)
tools = ["boss_guide", "enemies"]
report = "GM8XdBHaqpFgxK9Q"
question = "Are we killing the adds in the right order on Nymrissa?"
boss = "Nymrissa Wavecaller"
expect = """The log doesn't record the murlocs dying, so it can't show the order they were killed in (anything like
damage on the Frostscales is an indirect sign, said as such); what it does show is the outcome: no murloc became a
Bubblefin Berserker on the kill, while Berserkers' Pulsing Tides hit the raid on the wipes."""
facts = ["the kill is pull 8",
         "on the kill, 119 Shorerunners and 14 Frostscales came, none has a death recorded, and no Berserker came",
         "Pulsing Tides was the killing blow 28 times over the night, until each wipe was decided",
         "the best wipe, 7.6% on pull 7, ended when Berserkers came and their Pulsing Tides killed most of the raid",
         "Frostscale first is the guide's rule, not something the log shows"]
wrong = ["states, as something the log shows, the order the adds died in or that the Frostscales died first (advising Frostscale first as the guide's rule is fine)",
         "says Berserkers got into the fight on the kill"]
[[case]]
id = "night-dispels"
tools = ["boss_guide", "breakdown", "death_recap", "mechanic_hits", "pull_summary"]
report = "8TcXMAP2gHQGr9pW"
where = "in a DM"  # a DM, as the asker had it
question = "Were our dispels fast enough on Vashnik?"
asker = "Miralupa"
boss = "Vashnik the Malignant"
expect = """Yes, or mostly yes: nearly every Exploding Infection was dispelled, and slow dispels are not what cost
the night. Naming the few held long is fair: the one held into the Imbibe that went off and cost pull 4, and the ones
on the kill (Sveini's through the 6:00 Imbibe, Krøpling's never dispelled), which cost nothing there."""
facts = ["104 of 113 Exploding Infections were dispelled over the 8 pulls; 35 of 36 on the kill",
         "the one never dispelled on the kill was Krøpling's, from 6:19: it killed them at 6:31, a second before the boss died",
         "Exploding Infection itself killed 3 over the night",
         "the guide wants it dispelled one at a time when the raid is stable, since each removal hits the whole raid"]
# On the kill a totem went off at the 6:00 Imbibe (Malignance on 19 players at 6:05, Krøpling among them), and
# Sveini's Infection reached 12 stacks at 6:04 before it was dispelled; Dragepie died to Caustic Explosion the second
# Krøpling did. Pull 4: Martin's reached 11 stacks at 1:51, after the Imbibe; Caustic Explosion killed him and three
# more. No raid note shows who had which dispel.
wrong = ["says slow dispels caused most of the wipes",
         "says Congealing Bolt needed dispelling (most ran out undispelled)",
         "blames a named healer for Krøpling's death"]
[[case]]
id = "night-kill-vs-best-wipe"  # execution, not a new plan
tools = ["boss_guide", "breakdown", "compare_pulls", "progress", "pull_summary", "pull_timeline"]
report = "dTQMvNbBcPh6mDrA"
question = "Compare our kill with the best wipe: what did we do differently?"
asker = "Enfo"
boss = "The Twin Fangs"
expect = """The difference was staying alive through the middle of the fight, not a new plan or more damage per
player: both pulls did about the same damage per second and both ran into the 8:07 enrage; the kill had nobody die until
6:46, while the best wipe (pull 6, 2.3%) lost a healer at 5:55 and three players to the 6:48 Ravenous Feast, fell
behind and was short when the enrage came."""
facts = ["damage per second over each pull: 2.07M/s on pull 6 until its enrage at 8:07, 2.12M/s on the kill",
         "boss health 10% at 7:07 on the kill against 7:19 on pull 6",
         "both pulls reached the enrage (Caustic Rain, at the third Submerge) at 8:07; on the kill one twin died at 8:11 and the other at 8:14, seconds into it",
         "the kill was messy late: 12 deaths, most from 7:39 on, once the boss was nearly dead"]
derived = ["10%"]  # the timeline prints the boss's health without a % sign ("7:07 10")
wrong = ["the kill used a different cooldown plan or strategy",
         "credits the kill to more damage per player rather than to who stayed alive",
         "says the kill had few or no deaths in all (it had 12, most from 7:39 on; none until 6:46 is right)",
         "says deaths alone ended the best wipe, not the enrage at 8:07"]
[[case]]
id = "night-summary-for-raid"  # short, for the raid: the night's one lesson
tools = ["boss_guide", "progress", "pull_summary"]
report = "PjKR7hQwtYpd8WDz"
question = "Give me a 3-line summary for the raid of tonight's Ula'tek progress and what to change next week."
asker = "Miralupa"
boss = "Ula'tek"
expect = """Short (about three lines): the boss died on pull 8 (8:49). Mother's Wrath was the night's killer: on three
Phase One wipes it hit the whole raid at once, which it does when its target is out of reach, so the change is keeping
the boss and her tail tanked in reach through Phase One. (The best wipe, pull 6 at 8.7% in the last phase, 6.2% as
Warcraft Logs counts it, was a Serpent's Bite left unsoaked.)"""
facts = ["the kill on pull 8 at 8:49, with 7 deaths",
         "Mother's Wrath killed many at once on pulls 1, 3 and 4",
         "Mother's Wrath the night's killer, 61 deaths until each wipe was decided",
         "the best wipe (pull 6, P3 8.7%, WCL 6.2%) was a Calcified Corpse from an unsoaked Serpent's Bite"]
wrong = ["treats Mother's Wrath as raid damage to heal through or survive with cooldowns, not as its target being out of reach",
         "makes more damage from rotations, gear or cooldowns the change for next week",
         "blames a named tank for Mother's Wrath going out (the log doesn't show why its target was out of reach)"]
[[case]]
id = "healers-imbibe-cooldowns"  # the guide's plan for a role against the log: cooldowns through each Imbibe
tools = ["boss_guide", "healing", "pull_timeline", "raid_note"]
report = "kTMfFRQ324Hvx6G7"
question = "Did we line up our healing cooldowns for Imbibe on the Vashnik kill?"
asker = "Enfo"
pull = 19
boss = "Vashnik the Malignant"
expect = """Yes: from the second Imbibe on (1:48, 3:12, 4:36, 6:00) each had healing and raid cooldowns on it, as
the guide's plan asks (the raid stacks in melee for the healing cooldowns that carry it through Imbibe); the first, at
0:23, came while the opening cooldowns were still up, with an Anti-Magic Zone at 0:22. Nobody died to it. Calling one
of them the thinnest is fair (3:12 and 4:36 had three each before the cast)."""
facts = ["five Imbibes: 0:23, 1:48, 3:12, 4:36, 6:00",
         "the 3:12 Imbibe had the fewest: Divine Hymn at 3:04, Rallying Cry at 3:08 and Zephyr at 3:10",
         "at 1:48: Divine Hymn at 1:39, then Rallying Cry, Spirit Link Totem and Anti-Magic Zone at 1:46 and Darkness at 1:47",
         "at 6:00: Divine Hymn, Apotheosis, Rallying Cry, Spirit Link Totem, Zephyr, two Anti-Magic Zones and Rewind in the 9 s before it",
         "the deaths on the kill were to Plague Wave, Burning Presence and the tank's own hits"]
wrong = ["says an Imbibe from 1:48 on got no healing or raid cooldown",
         "says players died to Imbibe or Malignance on the kill"]
[[case]]
id = "night-adds-damage-and-waves"  # from the raiders' own question about the night's adds (answers #599-#604)
tools = ["enemies"]
report = "fvkH4hGZwDRVnyXJ"
where = "in a DM"
question = "Can you go through the damage done on the three adds that spawn on the Twin Fangs tonight, and how fast or slow they die?"
asker = "Enfo"
boss = "The Twin Fangs"
expect = """Only the Spawn of Vexhul have deaths in the log: the first wave dies by about 0:42-0:47 on every pull
that reached it, the second by about 1:45-1:48. The Barbed Bulwarks and the Broodlings of Ithraz have no death
recorded, so the log can't show how fast they were killed. Whether the Spawns die fast enough is the answer's to
judge, either way."""
facts = ["Spawn of Vexhul: 105 came over 24 pulls, 95 died",
         "most of their Corrosive Spits went through: 99 of 175",
         "the Broodlings took no damage at all",
         "the first wave on 24 pulls, the second on 9",
         "Pomaa did the most damage on the Spawns (137.51M), then Dscopi and Nalaxd (about 100M each)",
         "512 Barbed Bulwarks came and took only 1.51M in all",
         "Visceral Burst: 392 begun, 309 kicked, 66 went through"]
# Method's guide has one Spawn burst before its first Corrosive Spit and the other two killed before their second; the
# first spits land 1-2 s after a wave comes (pull 26: 0:38, 0:39), before any Spawn dies. A kill at the raid's item
# level (compare_pulls) kills its waves about as fast, so the expect leaves the pace to the answer.
wrong = ["states, as something the log shows, when the Barbed Bulwarks or the Broodlings of Ithraz died or how fast they were killed"]

# ---- The raid leader's harder questions, written from the tools' output before any answer was read: ranking
#      problems, progress over weeks, a plan. ----

[[case]]
id = "night-three-things-to-fix"  # ranking problems by the pulls they ended, not by deaths
tools = ["progress"]
report = "vjt3KLbN8g62J1H9"
where = "in a DM"
question = "What are the three things we most need to fix on Sszorak from last night?"
asker = "Enfo"
boss = "Sszorak"
expect = """Three priorities, most important first, ranked by the pulls each ended: the Serpent's Fury stacks that
let the boss enrage (Unbound Ferocity, the first thing that ended 11 of the 42 pulls) first or second, and the Mutilate
soak (8) among the three with a change of its own (a Mutilate that kills four often leaves too few for the stack). The
third can be the many dying at once with no killing blow around the Howling Maelstrom (10 pulls, 13 with its Viscous
Cysts), in either order with Mutilate, or staying alive through the stretches of deaths (Tempest the night's killer);
each with a change."""
facts = ["Unbound Ferocity ended 11 pulls first",
         "Mutilate killing many ended 8, deaths one after another 5",
         "Tempest the night's killer: 62 deaths, the first death on 12 pulls",
         "the best wipe, 34.1% on pull 42"]
# 10 = 6 "deaths leading into many dying at once, no killing blow" + 4 "many dying at once, no killing blow";
# 13 = those 10 + 3 "deaths leading into Viscous Cyst killing many" (progress prints the three counts, neither sum)
derived = ["10", "13"]
# progress counts the pulls by the first thing that ended each; the night's killer counts deaths, so Tempest tops it
# while the stacks and the soak lost more pulls. Leading with Tempest is the tempting misreading. Mutilate first, with
# the enrage as what it often leads to, is a raid leader's reading too (22 October: every such answer argued it).
wrong = ["leads with Tempest, or with damage, as the most important thing to fix",
         "gives more than three priorities, or none in order"]

[[case]]
id = "night-better-than-last-week"  # progress over weeks: further, but the same things end the pulls
tools = ["progress"]
report = "vjt3KLbN8g62J1H9"
question = "Are we doing better on Sszorak than last week?"
asker = "Enfo"
boss = "Sszorak"
expect = """Yes in how far pulls get: the best wipe went from 62.6% (5 October) to 34.1% (12 October). But the same
things still end the pulls: the boss keeping Unbound Ferocity (10, then 11 pulls) and Mutilate killing many (7, 5 of
them after earlier deaths, then 8)."""
facts = ["33 pulls on 5 October, 42 on 12 October",
         "the best wipes were pull 13 and pull 42",
         "deaths one after another ended 6, then 5"]
derived = ["7"]  # 5 October: 5 "deaths leading into Mutilate killing many" + 2 "Mutilate killing many"
wrong = ["says the raid did worse than the week before",
         "says the pulls now end on something different from the week before"]

[[case]]
id = "plan-healing-cooldowns-sszorak"  # a plan from the spikes that come back, and a mechanic left to the mechanic
tools = ["healing"]
report = "fvkH4hGZwDRVnyXJ"
where = "in a DM"
question = "Make us a healing cooldown plan for Sszorak from tonight's pulls."
asker = "Enfo"
boss = "Sszorak"
expect = """A plan of healing cooldowns by time over the fight, which cooldown when, built from the night's kill and its
spikes, with a cooldown on the Virulence and Mutilated Gash wave around 0:23-0:28; it says the log can't show who
was assigned."""
facts = ["the 0:23-0:28 spike: 3.55M/s taken, 0.8 healing cooldowns per spike, 17 deaths",
         "on each of the 6 pulls that spike came, a healing cooldown was ready and unused",
         "the Viscous Cyst bursts at 1:41-1:43 are a mechanic to handle, not only a cooldown to add",
         "Spirit Link Totem (Enfo) the cooldown most often ready and unused, 10 times",
         "the 1:41-1:43 Viscous Cyst spikes: 5.29M/s taken, healing 1.94M/s"]
# 22 October: every answer built its plan from the kill's own timeline (pull 14) and fixed its one late set, a raid
# leader's way to plan farm; the case asked first for the spike that came back most, which none led with.
wrong = ["names a healer as having failed an assigned cooldown (there is no raid note)"]


