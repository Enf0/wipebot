[defaults]
report = "KBYT4xXn7VNjDgh8"

# ---- The Discord bot's own rules: where it answers, the asker's DMs, its posts. Run only with --bot: the other
#      modes answer in the asker's own chat, where these rules mean nothing. ----

[[case]]
id = "night-who-pulls-early"  # the first hit is a fact; one player on the boss alone is the only pull the log shows
tools = ["progress"]
report = "vjt3KLbN8g62J1H9"
where = "in a DM"
question = "who keeps pulling the boss early on Sszorak?"
asker = "Enfo"
boss = "Sszorak"
expect = """Not as a habit: on all but two pulls the raid opened together, the first hit within half a second of the
next player's, so who was first most often is just the fastest opener. The two exceptions were both Martin's, pulls
the raid wasn't ready for and reset: on pull 19 nobody else hit the boss in the first 5 s, and on pull 10 they were
first and the raid reset with the boss at full health. The log has no pull timer, so how early against the
countdown can't be told."""
facts = ["Zebinomage first on 13 of 42 pulls, Krøpling 9, Scopidruid 7",
         "pull 19: Martin hit the boss and nobody else did in the first 5 s; reset",
         "pull 10: Martin first, reset with the boss at full health"]
wrong = ["names the fastest openers (Zebinomage, Krøpling, Scopidruid) as pulling early",
         "says the log shows the pull timer or the countdown"]

[[case]]
id = "real-sentinels-helical-officers"  # in a DM: who carried Helical Toxins to the end (answer #392)
tools = ["boss_guide", "mechanic_hits", "pull_map", "pull_summary", "pull_timeline", "raid_note", "wcl_query"]
report = "cZ8rp13y72gBQKY9"
where = "in a DM"
question = "but who fucked up helical?"
asker = "Enfo"
pull = 5
boss = "Entombed Sentinels"
expect = """Naming them (in a DM): six never neutralized Helical Toxins in the second
intermission and got Cultivated Burst at 3:01, Pomaa, Fappachino, Peggerino, Sveini, Dragepie and Enfo; five of them
died to it at 3:02-3:04, which lost the pull. The log doesn't record anyone's starting orb count; who collided can
only be worked out from debuff changes landing at the same moment, and an answer that does so may lead with it as long
as it names all six."""
facts = ["Enfo died to Blood Venom at 3:04 with the burst on",
         "Enfo and Dragepie went to 5 stacks together at 2:41, and Pomaa and Fappachino gained stacks with them at 2:44",
         "the bosses gained Ula'tek's Dominance at 3:07, after those deaths",
         "players with 3 orbs stand still, 1 seek them, 2 pair with 2, to make exactly 4"]
wrong = ["names someone outside those six as having kept Helical Toxins to the end",
         "states a player's starting orb count as a recorded fact",
         "says Ula'tek's Dominance or the deaths after 3:04 lost the pull",
         "says it can't or won't name who kept Helical Toxins to the end"]
[[case]]
# Asked for something quick, with nothing saying the raid is on: the prompt's other way into the short form. Held by
# code like the case below (all nine saved answers ran to two or three sentences a bullet, and the judge passed them).
id = "between-pulls-quick"
tools = ["pull_summary"]
question = "quick, why did we wipe? pulling again in a sec"
pull = 33
boss = "Sszorak"
expect = """Mutilate killed four at 2:15, leaving too few for the Serpent's Fury stack, so the boss enraged at 2:32;
the fix is that soak."""
form = {bullets = 3, bullet_sentences = 1}  # by code, as the bot: what the prompt asks for when asked to be quick
numbers = ["2:15", "2:32"]  # by code: the Mutilate and the enrage
facts = ["2:15", "2:32"]
wrong = ["blames the enrage's fallout deaths after 2:32"]
[[case]]
# The raid is going on: a plain question is answered as between pulls too. The short form is held by code (`form`:
# every saved answer to this pull ran to two or three sentences a bullet, and the judge passed them all); the judge
# reads only what the answer says.
id = "live-raid-plain-question"
question = "Why did we wipe?"
pull = 33
boss = "Sszorak"
live = true
expect = """Mutilate killed four at 2:15, leaving too few for the Serpent's Fury stack, so the boss enraged at 2:32;
the fix is that soak."""
form = {bullets = 3, bullet_sentences = 1}  # by code, as the bot: what the prompt asks for while a raid is on
numbers = ["2:15", "2:32"]  # by code: the Mutilate and the enrage
facts = ["2:15", "2:32"]
wrong = ["blames the enrage's fallout deaths after 2:32"]
