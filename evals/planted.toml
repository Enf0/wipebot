# Answers written to be wrong, one known way each: the judge must fail every one (`just evals --planted`;
# evals/planted.py, and evals/README.md under "Planted answers").
#
# A plant is written by hand for one case, never by a model and never from a saved answer or a raider's words:
#   case    the case's id
#   kind    "wrong": a fair short answer to the case's question but for one thing: it states `item` plainly as true,
#           as its conclusion where the item is about a cause. It states nothing else of the case's wrong list.
#           "vague": an answer on the case's subject with every specific taken out (no player, time, number or
#           ability), only what anyone could say without reading the log. It need not be wrong, only empty.
#   item    a wrong plant: the item of the case's `wrong` list it states, word for word as the case has it (the
#           first of the list, unless that one can't be stated). Where the item gives alternatives ("calls it an
#           enrage, or says the raid needs more damage") the plant states the first.
#   answer  two to four sentences in the question's language, as the bot would answer. It turns on the item's claim
#           and on no number of the case's `expect`, so a corrected number leaves it true to its item.
#
# Read a plant back as the judge is asked (checks.WRONG): "Does the answer state any of these as true?", each item
# "as narrowly as it's written", and "a claim that something caused or lost the pull counts only if the answer names
# it as the cause". If a fair judge could say the plant doesn't state the item, it is too soft: state it flat.
# Every case but the held-out ones has its wrong plant (a test holds that), in the cases' own order below. A changed
# wrong item leaves its plant stale: `just evals --lint` says so, and the plant is rewritten.

