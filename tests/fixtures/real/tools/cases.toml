# adds' casts that went through, and who had a kick ready for each
nekzali-enemies = { tool = "enemies", report = "BfgjDv6LC2HaVbFm", boss = "Nek'zali", pull = 2 }
# every pull: murlocs whose deaths aren't in the log, so their kill order isn't either
nymrissa-enemies-night = { tool = "enemies", report = "GM8XdBHaqpFgxK9Q", boss = "Nymrissa Wavecaller", all_pulls = true }
# every pull: the adds' casts, kicked and by whom, summed over the night
nekzali-enemies-night = { tool = "enemies", report = "BfgjDv6LC2HaVbFm", boss = "Nek'zali", all_pulls = true }
