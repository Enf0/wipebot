vashnik-tank-swaps = { tool = "tank_swaps", report = "kTMfFRQ324Hvx6G7", boss = "Vashnik", pull = 16 }
# the night's own kill, later in the report
compare-with-kill = { tool = "compare_pulls", local = true, report = "kTMfFRQ324Hvx6G7", boss = "Vashnik", pull = 16 }
compare-pulls = { tool = "compare_pulls", report = "KBYT4xXn7VNjDgh8", pull = 12, other = 13 }
