mechanic-hits = { tool = "mechanic_hits", report = "KBYT4xXn7VNjDgh8", ability = "Tempest", all_pulls = true }
# a debuff baited onto one player: each time it went on someone else, and whether they were alive
mechanic-hits-bait = { tool = "mechanic_hits", report = "KBYT4xXn7VNjDgh8", ability = "Serpent's Fury", all_pulls = true, whole_pull = true }
mechanic-outliers = { tool = "mechanic_hits", report = "KBYT4xXn7VNjDgh8", pull = 13 }
