# The tool cases: each runs one tool on recorded answers (recorded.sqlite) and is pinned to <name>.txt here
# (test_tools.py). To add one: a line below, `just record-tools`, `just snapshot`, then read the new file.
#
#   name = { tool = "<tool>", <its arguments> }    an argument { file = "<path>" } is that file's text, from real/
#
# `local = true`: the case reads Warcraft Logs' rankings, another guild's report (the top parses, the fastest
# kills) or a Raidbots data file, which may not be published; its answers and snapshot are in local/, untracked
# (tests/README.md).
#
# The reports:
#   KBYT4xXn7VNjDgh8  Mon 5 Oct: Vashnik killed on pull 2, 33 Sszorak pulls (the captured night, ../KBYT...json)
#   vjt3KLbN8g62J1H9  Mon 12 Oct: 42 Sszorak pulls, with that night's raid note (../notes)
#   kTMfFRQ324Hvx6G7  Mon 28 Sep: Entombed Sentinels killed on pull 8, Vashnik the Malignant on pull 19
#   GM8XdBHaqpFgxK9Q  Mon 21 Sep: Nymrissa Wavecaller killed on pull 8
#   8TcXMAP2gHQGr9pW  Wed 7 Oct: a Heroic Coiled Altar wipe at 0.3%, phases and an intermission
#   BfgjDv6LC2HaVbFm  Wed 30 Sep: Mythic Nek'zali, two pulls with kicks on its adds
# All are reports of The Dragonfell Tribe, the maintainers' guild (tests/README.md). Bosses other than Sszorak are
# where how a pull ended is easy to get wrong (a tank death, a battle res, adds).

# ---- one pull ----
pull-summary = { tool = "pull_summary", report = "KBYT4xXn7VNjDgh8", pull = 13 }
vashnik-summary = { tool = "pull_summary", report = "kTMfFRQ324Hvx6G7", boss = "Vashnik", pull = 16 }
